services:
  mongo:
    image: mongo:7
    container_name: mqm-mongo
    command: ["mongod", "--quiet"]  # suppress per-connection log spam from the healthcheck
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: wipes and re-seeds the database, then exits.
  seed:
    build: ./testbed
    command: ["node", "seed/seed.js"]
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: testbed
    depends_on:
      mongo:
        condition: service_healthy

  app:
    build: ./testbed
    container_name: mqm-app
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: testbed
      PORT: 3000
      # none | sanitizer | regex | mqm  (see testbed/app/protections/)
      PROTECTION: ${PROTECTION:-none}
      # MQM only: learn | enforce | monitor  (see testbed/app/protections/mqm.js for all options)
      MQM_MODE: ${MQM_MODE:-learn}
      MQM_SITE_KEY: ${MQM_SITE_KEY:-callsite}
      MQM_UNKNOWN: ${MQM_UNKNOWN:-block}
      MQM_LOG: /usr/src/testbed/mqm-data/blocked.jsonl
      # regex only: block | monitor  (see testbed/app/protections/regex.js)
      REGEX_MODE: ${REGEX_MODE:-block}
      REGEX_LOG: /usr/src/testbed/mqm-data/regex-blocked.jsonl
    volumes:
      # MQM's learned model (and block log) live on the host, so a model learned in
      # learn mode survives the container restart into enforce mode
      - ./testbed/mqm-data:/usr/src/testbed/mqm-data
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  mongo-data:
